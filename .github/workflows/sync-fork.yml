name: Scheduled Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight (UTC). Adjust as needed.
  workflow_dispatch: # Allows you to manually trigger it via the "Actions" tab.

jobs:
  sync:
    name: Sync Latest Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
      
      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main        # The branch in your fork to update
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # Built-in token, no setup required
          upstream_sync_repo: ChuckBuilds/LEDMatrix  # Replace with the ORIGINAL repository (e.g., facebook/react)
          upstream_sync_branch: main      # The branch you are pulling from the original repo
